name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test stop-backend.ps1 against real processes
        shell: powershell
        run: ./frontend/src-tauri/tests/stop-backend.Tests.ps1

      # ── Backend ──────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend JAR
        working-directory: backend
        shell: cmd
        run: mvnw.cmd -B package -DPOSTGRES_DB_USERNAME="${{ secrets.POSTGRES_DB_USERNAME }}" -DPOSTGRES_DB_PASSWORD="${{ secrets.POSTGRES_DB_PASSWORD }}"

      - name: Copy backend JAR to Tauri binaries
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries
          $jar = Get-ChildItem backend/target/planilla-backend-*.jar |
            Where-Object { $_.Name -notlike '*.jar.original' } |
            Select-Object -First 1
          if (-not $jar) { throw "Backend JAR not found in backend/target" }
          Copy-Item $jar.FullName frontend/src-tauri/binaries/backend.jar

      # ── JRE for bundling ─────────────────────────────────────
      - name: Download Windows JRE 21
        run: |
          $jreUrl = "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          Invoke-WebRequest -Uri $jreUrl -OutFile jre.zip -MaximumRetryCount 3

      - name: Extract JRE to Tauri binaries
        run: |
          Expand-Archive -Path jre.zip -DestinationPath jre-temp
          $jreRoot = Get-ChildItem -Path jre-temp -Directory | Select-Object -First 1
          $dest = "frontend/src-tauri/binaries/jre"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Path "$($jreRoot.FullName)/*" -Destination $dest -Recurse -Force
          Remove-Item -Recurse -Force jre-temp, jre.zip

      # ── Frontend ─────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ── Rust / Tauri ─────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Build Tauri (Windows NSIS)
        working-directory: frontend
        run: npx tauri build --bundles nsis

      # The shipped installer is set aside, checked free of the debugging port, before the storage
      # test builds its own variant. Upload and Release read only this copy.
      - name: Keep the release installer
        shell: powershell
        run: |
          ./frontend/src-tauri/tests/debug-port-guard.ps1 -Exe frontend/src-tauri/target/release/planilla-lito.exe -Expect absent
          New-Item -ItemType Directory -Force release-installer | Out-Null
          Copy-Item frontend/src-tauri/target/release/bundle/nsis/*.exe release-installer/
          $kept = @(Get-ChildItem release-installer/*.exe)
          if ($kept.Count -ne 1) { throw "Expected exactly one release installer, found $($kept.Count)." }
          Write-Host "ok - release installer kept: $($kept[0].Name)"

      # The copy of a session kept on the PC (the app's WebView2 storage) must survive a restart, a
      # kill and an upgrade install. Tested on a build that differs only by a WebView2 debugging
      # port, which the test needs to reach the app's storage and the shipped installer must not have.
      - name: Check the storage-test variant matches the shipped config
        run: node frontend/src-tauri/tests/storage-variant-matches.mjs

      - name: Build the storage-test variant
        working-directory: frontend
        run: npx tauri build --bundles nsis --config src-tauri/tauri.storage-test.conf.json

      - name: Keep the storage-test installer
        shell: powershell
        run: |
          ./frontend/src-tauri/tests/debug-port-guard.ps1 -Exe frontend/src-tauri/target/release/planilla-lito.exe -Expect present
          New-Item -ItemType Directory -Force storage-test-installer | Out-Null
          Copy-Item frontend/src-tauri/target/release/bundle/nsis/*.exe storage-test-installer/

      - name: Test the app's own storage across restart, kill and reinstall
        shell: powershell
        run: |
          $variant = @(Get-ChildItem storage-test-installer/*.exe)
          if ($variant.Count -ne 1) { throw "Expected exactly one storage-test installer, found $($variant.Count)." }
          ./frontend/src-tauri/tests/app-storage.Tests.ps1 -InstallerPath $variant[0].FullName

      # ── Upload artifact (always) ─────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release-installer/*.exe
          if-no-files-found: error

      # ── Create GitHub Release (only on tag push) ─────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem -Path release-installer/*.exe | Select-Object -First 1
          gh release create $tag $exe.FullName --title "$tag — Cargador de Planilla" --generate-notes
